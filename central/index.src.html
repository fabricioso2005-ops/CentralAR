<title>Central de Atendimento AR</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  /* Layout: faixa da marca + abas fixas → painel do dia, carteira (cartões) e agenda agrupada por dia; gestor ganha a aba Equipe */
  --ink:#1b2124; --muted:#5f686c; --bg:#f2f3f3; --panel:#ffffff; --line:#dcdfe0;
  --brand:#37454c; --band:#1f2325; --band-ink:#eceeee; --sand:#a82407; --sand-soft:#f6e5e0;
  --todo:#3b5b7e; --todo-soft:#e6edf5; --warn:#a86b12; --warn-soft:#fbefd9;
  --ok:#2c7a50; --ok-soft:#e1f1e7; --off:#7f878b; --off-soft:#eceeee; --wa:#1f8f4e; --on-brand:#ffffff;
  --font-display:"Archivo","Helvetica Neue",Arial,sans-serif;
  --font-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:10px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ink:#e8eaea; --muted:#a0a8ab; --bg:#111415; --panel:#1b2022; --line:#2c3437;
    --brand:#b9c5ca; --band:#0b0d0e; --band-ink:#e8eaea; --sand:#e2603f; --sand-soft:#38190f;
    --todo:#93b3dc; --todo-soft:#192838; --warn:#e3a74c; --warn-soft:#33270f;
    --ok:#62c58f; --ok-soft:#14301f; --off:#8f999d; --off-soft:#1c292e; --wa:#3dbb6f; --on-brand:#111415;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --ink:#e8eaea; --muted:#a0a8ab; --bg:#111415; --panel:#1b2022; --line:#2c3437;
  --brand:#b9c5ca; --band:#0b0d0e; --band-ink:#e8eaea; --sand:#e2603f; --sand-soft:#38190f;
  --todo:#93b3dc; --todo-soft:#192838; --warn:#e3a74c; --warn-soft:#33270f;
  --ok:#62c58f; --ok-soft:#14301f; --off:#8f999d; --off-soft:#1c292e; --wa:#3dbb6f; --on-brand:#111415;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.45;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--panel)}
h1,h2,h3{font-family:var(--font-display);text-wrap:balance;margin:0;letter-spacing:-.01em}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--brand)}
:focus-visible{outline:2px solid var(--sand);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* faixa */
.band{background:var(--band);color:var(--band-ink)}
.band .wrap{padding-block:14px 12px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.logo{height:40px;width:auto;display:block;flex:none}
.brandtxt{flex:1;min-width:180px}
.band h1{font-size:19px;font-weight:700}
.band p{margin:2px 0 0;font-size:12.5px;opacity:.75}
.who{display:flex;align-items:center;gap:8px;font-size:13px}
.who img{width:28px;height:28px;border-radius:50%;flex:none}
.who b{display:block;font-weight:600}
.who small{opacity:.7;font-size:11.5px}
.sync{font-size:12px;padding:4px 10px;border-radius:999px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.16);white-space:nowrap}
.sync::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:#9aa;margin-right:6px;vertical-align:1px}
.sync[data-s="ok"]::before{background:#4fd18b}
.sync[data-s="off"]::before{background:#d77}

/* abas */
.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--panel);border-bottom:1px solid var(--line)}
.tabs .wrap{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;align-items:center}
.tabs .wrap::-webkit-scrollbar{display:none}
.tabs a{flex:none;text-decoration:none;color:var(--muted);font-weight:500;font-size:14px;padding:12px 10px 10px;border-bottom:2.5px solid transparent;display:flex;gap:6px;align-items:center}
.tabs a[aria-current="page"]{color:var(--ink);border-bottom-color:var(--sand);font-weight:600}
.tabs b{font-weight:600;font-size:11.5px;background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:0 7px;color:var(--muted)}
.tabs b.hot{background:var(--sand);border-color:var(--sand);color:var(--on-brand)}

.viewbar{background:var(--sand-soft);border-bottom:1px solid var(--line);font-size:13.5px}
.viewbar .wrap{padding-block:8px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.viewbar select{width:auto;min-width:200px}

main.wrap{padding-block:18px 90px;display:flex;flex-direction:column;gap:16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px;min-width:0}
.page-head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.page-head h2{font-size:22px;font-weight:800}
.lede{color:var(--muted);margin:4px 0 0;max-width:68ch}
.sec-title{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.sec-title h3{font-size:16px;font-weight:700}
.sec-title small{color:var(--muted);font-size:12.5px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:16px}
@media (max-width:420px){.grid2{grid-template-columns:1fr}}

/* KPIs */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;border-top:3px solid var(--line);text-decoration:none;color:inherit;display:block}
.kpi .v{font-family:var(--font-display);font-weight:800;font-size:28px;line-height:1.1;font-variant-numeric:tabular-nums}
.kpi .l{font-size:12.5px;color:var(--muted);margin-top:2px}
.kpi[data-k="hoje"]{border-top-color:var(--sand)} .kpi[data-k="sem"]{border-top-color:var(--todo)}
.kpi[data-k="atr"]{border-top-color:var(--warn)} .kpi[data-k="imob"]{border-top-color:var(--brand)} .kpi[data-k="cor"]{border-top-color:var(--ok)}

/* alerta de visita próxima */
.soon{display:flex;gap:12px;align-items:center;background:var(--sand);color:var(--on-brand);border-radius:var(--r);padding:12px 14px;flex-wrap:wrap}
.soon strong{font-family:var(--font-display);font-size:16px}
.soon .btn{background:transparent;border-color:currentColor;color:inherit}

/* botões e campos */
.btn{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:8px 12px;font-weight:500;font-size:13.5px;cursor:pointer;text-decoration:none;color:var(--ink);display:inline-flex;gap:6px;align-items:center;white-space:nowrap}
.btn:hover{border-color:var(--brand)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.btn.ghost{border-color:transparent;background:none;color:var(--brand);padding-inline:6px}
.btn.danger{color:var(--sand);border-color:var(--sand)}
.btn.sm{padding:5px 9px;font-size:12.5px}
.btn:disabled{opacity:.55;cursor:not-allowed}
.btn svg{width:14px;height:14px;flex:none}
input[type=text],input[type=tel],input[type=email],input[type=date],input[type=time],input[type=search],select,textarea{padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--panel);font-size:14px;width:100%;min-width:0}
textarea{min-height:70px;resize:vertical}
.search{flex:1;min-width:200px;background:var(--bg)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--panel)}
.seg button{border:0;background:none;padding:7px 12px;font-size:13px;font-weight:500;cursor:pointer;color:var(--muted);border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--brand);color:var(--on-brand)}

/* cartões de parceiro */
.list{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:10px}
@media (max-width:420px){.list{grid-template-columns:1fr}}
.pc{background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--todo);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:8px;min-width:0}
.pc[data-e="ativo"]{border-left-color:var(--warn)} .pc[data-e="parceiro"]{border-left-color:var(--ok)} .pc[data-e="inativo"]{border-left-color:var(--off);opacity:.8}
.pc h4{margin:0;font-family:var(--font-display);font-size:15.5px;font-weight:700;overflow-wrap:anywhere}
.pc .sub{font-size:12.5px;color:var(--muted);overflow-wrap:anywhere}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{font-size:11.5px;padding:2px 7px;border-radius:5px;background:var(--bg);border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.chip.t-imobiliaria{background:var(--todo-soft);color:var(--todo);border-color:transparent;font-weight:600}
.chip.t-corretor{background:var(--ok-soft);color:var(--ok);border-color:transparent;font-weight:600}
.chip.late{background:var(--warn-soft);color:var(--warn);border-color:transparent;font-weight:600}
.chip.e-novo{color:var(--todo)} .chip.e-ativo{color:var(--warn)} .chip.e-parceiro{color:var(--ok)}
.wa{color:var(--wa);border-color:var(--wa)}
.last{font-size:12.5px;color:var(--muted);border-left:2px solid var(--line);padding-left:8px;overflow-wrap:anywhere}
.acts{display:flex;gap:6px;flex-wrap:wrap}
.hist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;font-size:13px}
.hist li{border-left:2px solid var(--line);padding-left:8px;overflow-wrap:anywhere}
.hist time{color:var(--muted);font-size:12px;display:block}

/* agenda */
.day{display:flex;flex-direction:column;gap:8px}
.day h4{margin:0;font-family:var(--font-display);font-size:13px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.day h4.today{color:var(--sand)}
.vis{display:grid;grid-template-columns:64px 1fr;gap:12px;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:12px;min-width:0}
.vis .hr{font-family:var(--font-display);font-weight:800;font-size:18px;font-variant-numeric:tabular-nums;line-height:1.1}
.vis .hr small{display:block;font-family:var(--font-body);font-weight:400;font-size:11.5px;color:var(--muted)}
.vis .body{display:flex;flex-direction:column;gap:6px;min-width:0}
.vis h5{margin:0;font-size:15px;font-weight:600;overflow-wrap:anywhere}
.vis[data-s="realizada"]{opacity:.75} .vis[data-s="realizada"] .hr{color:var(--ok)}
.vis[data-s="cancelada"]{opacity:.55} .vis[data-s="cancelada"] h5{text-decoration:line-through}
.gcal-ok{font-size:12px;color:var(--ok);font-weight:600}
.msg{font-size:12.5px;padding:6px 9px;border-radius:6px;background:var(--warn-soft);color:var(--ink)}
.msg.err{background:var(--sand-soft)} .msg.ok{background:var(--ok-soft)}

/* listas simples */
.mini{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.mini li{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px;flex-wrap:wrap}
.mini li:last-child{border-bottom:0}
.mini .m{color:var(--muted);font-size:12.5px}
.empty{color:var(--muted);font-size:14px;padding:8px 0}
.empty-big{text-align:left;padding:22px;display:flex;flex-direction:column;gap:10px;align-items:flex-start}
.empty-big h3{font-size:18px}

/* equipe */
.tscroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{text-align:left;padding:8px;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:11.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);font-weight:600}
td .who{color:var(--ink)}
.steps{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px;color:var(--ink);font-size:14px;max-width:72ch}

/* login */
.login{max-width:560px;margin:24px auto;display:flex;flex-direction:column;gap:14px}
.login h2{font-size:24px;font-weight:800}
.login .who{color:var(--ink);font-size:14px}
.login .who img{width:40px;height:40px}

/* diálogo */
dialog{border:1px solid var(--line);border-radius:12px;padding:0;background:var(--panel);color:var(--ink);width:min(560px,calc(100vw - 24px));max-height:calc(100dvh - 24px)}
dialog::backdrop{background:rgba(10,12,13,.5)}
dialog form{display:flex;flex-direction:column;gap:12px;padding:18px}
dialog h3{font-size:18px}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fgrid .full{grid-column:1/-1}
@media (max-width:480px){.fgrid{grid-template-columns:1fr}}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);font-weight:500;text-transform:uppercase;letter-spacing:.04em;min-width:0}
label.f > *{text-transform:none;letter-spacing:0;color:var(--ink)}
.checks{display:flex;gap:8px;flex-wrap:wrap}
.chk{display:inline-flex;gap:6px;align-items:center;font-size:13.5px;padding:6px 10px;border:1px solid var(--line);border-radius:999px;cursor:pointer;background:var(--panel)}
.chk input{margin:0;accent-color:var(--brand)}
.dlg-acts{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}

.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--band);color:var(--band-ink);padding:10px 14px;border-radius:10px;font-size:14px;box-shadow:0 6px 24px rgba(0,0,0,.25);z-index:50;max-width:calc(100% - 32px)}
@media (prefers-reduced-motion: no-preference){.pc,.vis{transition:opacity .2s}}
</style>

<header class="band">
  <div class="wrap">
    <img class="logo" src="__LOGO__" alt="AR Incorporadora" width="235" height="110">
    <div class="brandtxt">
      <h1>Central de Atendimento</h1>
      <p>Carteira de imobiliárias e corretores · visitas · retornos</p>
    </div>
    <div class="who" id="who" hidden></div>
    <span id="sync" class="sync" data-s="wait">Conectando…</span>
  </div>
</header>
<nav class="tabs" aria-label="Áreas">
  <div class="wrap" id="tabs">
    <a href="#hoje" data-r="hoje">Meu dia <b id="n-hoje">—</b></a>
    <a href="#parceiros" data-r="parceiros">Imobiliárias e corretores <b id="n-parc">—</b></a>
    <a href="#agenda" data-r="agenda">Visitas <b id="n-vis">—</b></a>
    <a href="#equipe" data-r="equipe" id="tab-equipe" hidden>Equipe</a>
  </div>
</nav>
<div class="viewbar" id="viewbar" hidden>
  <div class="wrap">
    <label for="sel-alvo">Carteira exibida:</label>
    <select id="sel-alvo"></select>
    <span id="viewbar-note" class="m"></span>
  </div>
</div>

<main class="wrap" id="main">
  <div class="card empty-big">
    <h3>Carregando sua central…</h3>
    <p class="lede">Sua carteira de imobiliárias, corretores e visitas aparece aqui assim que a conexão for confirmada.</p>
  </div>
</main>

<dialog id="dlg"><form id="dlg-form" method="dialog"></form></dialog>
<div class="toast" id="toast" hidden role="status" aria-live="polite"></div>

<script>
(() => {
'use strict';
const TZ = 'America/Sao_Paulo';
const CAL = 'Google Calendar';
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2,'0');
const ICON = {
  wa:'<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2Zm0 18.2a8.2 8.2 0 0 1-4.2-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2Zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8s-.4-.1-.6.1-.7.8-.8 1-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.3-.4.3-.4.8-1.4.1-.2 0-.3 0-.4l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 0 0-.7.3 3 3 0 0 0-.9 2.2 5.2 5.2 0 0 0 1.1 2.8 11.9 11.9 0 0 0 4.6 4c1.7.7 2.4.8 3.2.7a2.8 2.8 0 0 0 1.8-1.3 2.3 2.3 0 0 0 .2-1.3c-.1-.1-.2-.2-.5-.3Z"/></svg>',
  cal:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>'
};
const ETAPAS = {novo:'Novo contato', ativo:'Em negociação', parceiro:'Parceiro ativo', inativo:'Inativo'};
const TIPOS = {imobiliaria:'Imobiliária', corretor:'Corretor autônomo'};
const CONTATO_TIPOS = ['WhatsApp','Ligação','Visita presencial','E-mail','Reunião'];

const S = {
  claude:null, db:null, user:null, mcp:null, me:null, gestor:false,
  status:'loading', entrou:null, alvo:null,
  parceiros:[], visitas:[], equipe:[], base:[], profiles:{},
  unsubCart:[], route:'hoje',
  f:{tipo:'todos', q:'', etapa:'', ord:'retorno'}, agModo:'proximas',
  gcalMsg:{}, busy:{}, counts:{}, confirmDel:null, imp:null
};

/* ---------- datas ---------- */
const hojeISO = () => { const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; };
const addDias = (iso, n) => { const [y,m,d] = iso.split('-').map(Number); const t = new Date(y,m-1,d+n); return `${t.getFullYear()}-${pad(t.getMonth()+1)}-${pad(t.getDate())}`; };
const parseLocal = s => { const [d,h='00:00'] = s.split('T'); const [y,m,dd] = d.split('-').map(Number); const [hh,mi] = h.split(':').map(Number); return new Date(y,m-1,dd,hh,mi); };
const fmtLocal = t => `${t.getFullYear()}-${pad(t.getMonth()+1)}-${pad(t.getDate())}T${pad(t.getHours())}:${pad(t.getMinutes())}`;
const fimDe = (inicio, dur) => { const t = parseLocal(inicio); t.setMinutes(t.getMinutes() + (Number(dur)||60)); return fmtLocal(t); };
const DIAS = ['domingo','segunda','terça','quarta','quinta','sexta','sábado'];
const MESES = ['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
function fmtDia(iso){
  const h = hojeISO();
  if (iso === h) return 'Hoje';
  if (iso === addDias(h,1)) return 'Amanhã';
  if (iso === addDias(h,-1)) return 'Ontem';
  const t = parseLocal(iso);
  return `${DIAS[t.getDay()]}, ${t.getDate()} ${MESES[t.getMonth()]}`;
}
const fmtCurto = iso => { if(!iso) return ''; const t = parseLocal(iso); return `${pad(t.getDate())}/${pad(t.getMonth()+1)}`; };
const fmtQuando = ms => { const t = new Date(ms); return `${pad(t.getDate())}/${pad(t.getMonth()+1)} ${pad(t.getHours())}:${pad(t.getMinutes())}`; };

/* ---------- utilidades ---------- */
const digits = s => String(s||'').replace(/\D/g,'');
function waNum(tel){ let d = digits(tel); if(!d) return ''; if(d.length===10||d.length===11) d = '55'+d; return d; }
function toast(t){ const el = $('#toast'); el.textContent = t; el.hidden = false; clearTimeout(toast._t); toast._t = setTimeout(()=>el.hidden=true, 3200); }
function setSync(s, t){ const el = $('#sync'); el.dataset.s = s; el.textContent = t; }
const norm = s => String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().trim();
const nomeDe = id => (S.profiles[id] && S.profiles[id].name) || (id === S.me?.id ? (S.me.name || 'Você') : 'Agente');
const emailDe = id => (S.profiles[id] && S.profiles[id].email) || (id === S.me?.id ? S.me.email : null);
const ehMinha = () => S.alvo === S.me?.id;

function gcalTemplateUrl(v){
  const f = s => s.replace(/[-:]/g,'') + '00';
  const p = new URLSearchParams({action:'TEMPLATE', text:tituloVisita(v), dates:`${f(v.inicio)}/${f(fimDe(v.inicio, v.duracao))}`, ctz:TZ, details:descVisita(v), location:v.local||''});
  return 'https://calendar.google.com/calendar/render?' + p.toString();
}
function tituloVisita(v){ return `Visita · ${v.parceiroNome || 'parceiro'}${v.cliente ? ' · ' + v.cliente : ''}`; }
function descVisita(v){
  const p = S.parceiros.find(x => x.id === v.parceiroId);
  return [
    p ? `${TIPOS[p.tipo]||''}: ${p.nome}${p.responsavel ? ' (' + p.responsavel + ')' : ''}` : '',
    p && p.telefone ? `Telefone: ${p.telefone}` : '',
    v.cliente ? `Cliente: ${v.cliente}` : '',
    v.obs ? `Observações: ${v.obs}` : '',
    'Agendado pela Central de Atendimento AR'
  ].filter(Boolean).join('\n');
}

/* ---------- conexão ---------- */
async function boot(){
  route();
  const c = window.claude;
  if (!c || typeof c.use !== 'function'){ S.status = 'semclaude'; setSync('off','Sem conexão'); render(); return; }
  S.claude = c;
  const [db, user] = await Promise.all([c.use('db'), c.use('user')]);
  if (!db || !user){ S.status = 'semdb'; setSync('off','Sem conexão'); render(); return; }
  S.db = db; S.user = user;
  S.me = await user.me();
  if (!S.me.id){ S.status = 'semid'; setSync('off','Sem login'); render(); return; }
  S.gestor = !!S.me.canEdit;
  S.status = 'ok';
  setSync('ok','Sincronizado');
  renderWho();
  c.use('mcp').then(m => { S.mcp = m; render(); }).catch(()=>{});
  db.doc('equipe/'+S.me.id).onSnapshot(snap => {
    S.entrou = snap.exists;
    if (S.entrou && !S.alvo) setAlvo(S.me.id);
    render();
  }, onDbErr);
  if (S.gestor){
    db.collection('equipe').onSnapshot(async snap => {
      S.equipe = snap.docs.map(d => ({id:d.id, ...d.data()}));
      await resolverPerfis();
      renderAlvoSel(); render();
    }, onDbErr);
    db.collection('base').limit(1000).onSnapshot(snap => {
      S.base = snap.docs.map(d => ({id:d.id, ...d.data()}));
      render();
    }, onDbErr);
  }
}
function onDbErr(e){
  if (e && e.code === 'revoked'){ S.status = 'semdb'; setSync('off','Acesso encerrado'); render(); return; }
  setSync('off','Erro de sincronização');
  console.warn(e);
}
async function resolverPerfis(){
  const ids = [...new Set([S.me.id, ...S.equipe.map(e => e.id)])];
  try { S.profiles = await S.user.profiles(ids); } catch(e){}
}
function renderWho(){
  const el = $('#who');
  el.hidden = false;
  el.innerHTML = `<img alt="" src="${esc(S.me.avatarUrl)}"><span><b></b><small>${S.gestor ? 'Gestor' : 'Agente comercial'}</small></span>`;
  el.querySelector('b').textContent = S.me.name || 'Você';
}
function setAlvo(id){
  S.unsubCart.forEach(u => u()); S.unsubCart = [];
  S.alvo = id; S.parceiros = []; S.visitas = []; S.cartPronta = {p:false, v:false};
  const base = 'carteiras/' + id;
  S.unsubCart.push(S.db.collection(base + '/parceiros').limit(1000).onSnapshot(snap => {
    S.parceiros = snap.docs.map(d => ({id:d.id, ...d.data()})); S.cartPronta.p = true; render();
  }, onDbErr));
  S.unsubCart.push(S.db.collection(base + '/visitas').limit(1000).onSnapshot(snap => {
    S.visitas = snap.docs.map(d => ({id:d.id, ...d.data()})); S.cartPronta.v = true; render();
  }, onDbErr));
  renderAlvoSel();
}
function renderAlvoSel(){
  const bar = $('#viewbar');
  if (!S.gestor || !S.entrou){ bar.hidden = true; return; }
  bar.hidden = false;
  const sel = $('#sel-alvo');
  const ids = [...new Set([S.me.id, ...S.equipe.map(e => e.id)])];
  sel.innerHTML = ids.map(id => `<option value="${esc(id)}">${esc(nomeDe(id))}${id === S.me.id ? ' (você)' : ''}</option>`).join('');
  sel.value = S.alvo || S.me.id;
  $('#viewbar-note').textContent = ehMinha() ? '' : 'Você está vendo e editando a carteira deste agente.';
}

/* ---------- rotas ---------- */
const ROTAS = ['hoje','parceiros','agenda','equipe'];
function route(){
  const h = location.hash.replace('#','');
  S.route = ROTAS.includes(h) ? h : 'hoje';
  if (S.route === 'equipe' && S.status === 'ok' && !S.gestor) S.route = 'hoje';
  document.querySelectorAll('#tabs a').forEach(a => a.setAttribute('aria-current', a.dataset.r === S.route ? 'page' : 'false'));
  if (S.route === 'equipe') carregarContagens();
  render();
  window.scrollTo(0,0);
}
window.addEventListener('hashchange', route);

/* ---------- derivados ---------- */
function derivados(){
  const h = hojeISO(), sem = addDias(h,7);
  const ativas = S.visitas.filter(v => v.status !== 'cancelada');
  const visHoje = ativas.filter(v => v.inicio.slice(0,10) === h && v.status === 'agendada');
  const visSem = ativas.filter(v => v.status === 'agendada' && v.inicio.slice(0,10) >= h && v.inicio.slice(0,10) <= sem);
  const retornos = S.parceiros.filter(p => p.proximoContato && p.proximoContato <= h && p.etapa !== 'inativo')
    .sort((a,b) => a.proximoContato.localeCompare(b.proximoContato));
  const now = Date.now();
  const emBreve = ativas.filter(v => v.status === 'agendada').filter(v => { const t = parseLocal(v.inicio).getTime(); return t >= now - 15*60e3 && t <= now + 2*3600e3; })
    .sort((a,b) => a.inicio.localeCompare(b.inicio));
  return {h, visHoje, visSem, retornos, emBreve,
    nImob: S.parceiros.filter(p => p.tipo === 'imobiliaria').length,
    nCor: S.parceiros.filter(p => p.tipo === 'corretor').length};
}

/* ---------- render ---------- */
function render(){
  $('#tab-equipe').hidden = !S.gestor;
  const main = $('#main');
  if (S.status !== 'ok'){ main.innerHTML = telaSemConexao(); return; }
  if (S.entrou === null){ main.innerHTML = `<div class="card empty-big"><h3>Abrindo sua conta…</h3></div>`; return; }
  if (!S.entrou){ main.innerHTML = telaLogin(); return; }
  const d = derivados();
  $('#n-hoje').textContent = d.visHoje.length + d.retornos.length;
  $('#n-hoje').className = (d.visHoje.length + d.retornos.length) ? 'hot' : '';
  $('#n-parc').textContent = S.parceiros.length;
  $('#n-vis').textContent = d.visSem.length;
  let html = '';
  if (S.route === 'hoje') html = viewHoje(d);
  else if (S.route === 'parceiros') html = viewParceiros();
  else if (S.route === 'agenda') html = viewAgenda();
  else if (S.route === 'equipe') html = viewEquipe();
  const y = window.scrollY;
  const foco = document.activeElement && document.activeElement.id;
  const sel = foco && document.activeElement.selectionStart;
  main.innerHTML = html;
  if (foco){ const el = document.getElementById(foco); if (el && main.contains(el)){ el.focus(); try{ if(sel!=null) el.setSelectionRange(sel,sel); }catch(e){} } }
  window.scrollTo(0,y);
}

  const txt = {

    semid:'Entre na sua conta do Claude para acessar sua carteira. Cada agente usa o próprio login e senha do Claude.',
    loading:'Conectando…'
  }[S.status] || 'Conectando…';
  return `<div class="card empty-big"><h3>Acesso à Central</h3><p class="lede">${esc(txt)}</p></div>`;

    <span class="acts">${p.telefone ? `<a class="btn sm wa" href="https://wa.me/${waNum(p.telefone)}" target="_blank" rel="noopener">${ICON.wa}WhatsApp</a>` : ''}<button class="btn sm" data-a="contato" data-id="${esc(p.id)}">Registrar contato</button></span></li>`).join('');
  const prox = d.visSem.sort((a,b)=>a.inicio.localeCompare(b.inicio)).slice(0,8).map(v => `<li><span><b>${esc(fmtDia(v.inicio.slice(0,10)))} · ${esc(v.inicio.slice(11))}</b><br><span class="m">${esc(v.parceiroNome||'')}${v.cliente?' · '+esc(v.cliente):''}${v.local?' · '+esc(v.local):''}</span></span>${v.gcal ? '<span class="gcal-ok">No Google Agenda</span>' : `<button class="btn sm" data-a="gcal" data-id="${esc(v.id)}">${ICON.cal}Pôr na agenda</button>`}</li>`).join('');
  const quem = ehMinha() ? 'Seu dia' : 'Dia de ' + nomeDe(S.alvo);
  const vazio = !S.parceiros.length && S.cartPronta && S.cartPronta.p;
  return `
  <div class="page-head"><div><h2>${esc(quem)}</h2><p class="lede">${esc(fmtDia(d.h))}, ${esc(fmtCurto(d.h))}. Visitas marcadas e parceiros esperando retorno.</p></div>

  ${soon}
  <div class="kpis">
    <a class="kpi" data-k="hoje" href="#agenda"><div class="v">${d.visHoje.length}</div><div class="l">visitas hoje</div></a>

    <a class="kpi" data-k="atr" href="#parceiros"><div class="v">${d.retornos.length}</div><div class="l">retornos pendentes</div></a>
    <a class="kpi" data-k="imob" href="#parceiros"><div class="v">${d.nImob}</div><div class="l">imobiliárias na carteira</div></a>
    <a class="kpi" data-k="cor" href="#parceiros"><div class="v">${d.nCor}</div><div class="l">corretores autônomos</div></a>
  </div>
  ${vazio ? `<div class="card empty-big"><h3>Sua carteira está vazia</h3><p class="lede">Cadastre as imobiliárias e corretores que você atende, ou peça ao gestor para distribuir a base da planilha para você. Depois é só agendar as visitas e registrar cada contato.</p><button class="btn primary" data-a="novo-parceiro">Cadastrar o primeiro parceiro</button></div>` : ''}
  <div class="grid2">
    <section class="card"><div class="sec-title"><h3>Retornos para fazer</h3><small>${d.retornos.length} pendente${d.retornos.length===1?'':'s'}</small></div>
      ${ret ? `<ul class="mini">${ret}</ul>` : '<p class="empty">Nenhum retorno pendente. Ao registrar um contato, defina a data do próximo e ele aparece aqui no dia certo.</p>'}</section>
    <section class="card"><div class="sec-title"><h3>Próximas visitas</h3><small>7 dias</small></div>
      ${prox ? `<ul class="mini">${prox}</ul>` : '<p class="empty">Nenhuma visita marcada para esta semana.</p>'}</section>
  </div>`;
}

function filtrarParceiros(){
  const {tipo,q,etapa,ord} = S.f, nq = norm(q);
  let l = S.parceiros.filter(p => (tipo==='todos' || p.tipo===tipo) && (!etapa || p.etapa===etapa) &&
    (!nq || norm([p.nome,p.responsavel,p.telefone,p.cidade,p.creci,p.email,p.notas].join(' ')).includes(nq)));
  if (ord === 'nome') l.sort((a,b)=>a.nome.localeCompare(b.nome,'pt-BR'));
  else if (ord === 'recente') l.sort((a,b)=>(b.atualizadoEm||0)-(a.atualizadoEm||0));
  else l.sort((a,b)=>(a.proximoContato||'9999').localeCompare(b.proximoContato||'9999') || a.nome.localeCompare(b.nome,'pt-BR'));
  return l;
}
function cardParceiro(p, h){

      ${p.telefone ? `<a class="btn sm wa" href="https://wa.me/${waNum(p.telefone)}" target="_blank" rel="noopener">${ICON.wa}WhatsApp</a>` : ''}

    <div class="chips">
      <span class="chip t-${esc(p.tipo)}">${esc(TIPOS[p.tipo]||p.tipo)}</span>

      ${p.proximoContato ? `<span class="chip ${late?'late':''}">Retorno ${esc(fmtCurto(p.proximoContato))}</span>` : ''}
      ${visP ? `<span class="chip">${visP} visita${visP>1?'s':''} marcada${visP>1?'s':''}</span>` : ''}
    </div>
    ${p.telefone || p.email ? `<div class="sub num">${esc(p.telefone||'')}${p.telefone&&p.email?' · ':''}${esc(p.email||'')}</div>` : ''}
    ${ult ? `<div class="last"><b>${esc(ult.tipo)}</b> em ${esc(fmtQuando(ult.em))}: ${esc(ult.texto)}</div>` : p.notas ? `<div class="last">${esc(p.notas)}</div>` : ''}
    <div class="acts">
      <button class="btn sm" data-a="contato" data-id="${esc(p.id)}">Registrar contato</button>
      <button class="btn sm" data-a="nova-visita" data-id="${esc(p.id)}">Agendar visita</button>
      <button class="btn sm ghost" data-a="ver-parceiro" data-id="${esc(p.id)}">Histórico e edição</button>
    </div>
  </article>`;
}

function viewAgenda(){
  const h = hojeISO();
  const prox = S.agModo === 'proximas';
  const l = S.visitas.filter(v => prox ? (v.inicio.slice(0,10) >= h && v.status !== 'cancelada') || (v.inicio.slice(0,10) < h && v.status === 'agendada')
                                       : v.inicio.slice(0,10) < h || v.status === 'cancelada')
    .sort((a,b) => prox ? a.inicio.localeCompare(b.inicio) : b.inicio.localeCompare(a.inicio));
  const grupos = {};
  l.forEach(v => (grupos[v.inicio.slice(0,10)] ||= []).push(v));
  const dias = Object.keys(grupos);
  const semMcp = !S.mcp;
  return `
  <div class="page-head"><div><h2>Visitas</h2><p class="lede">Agende a visita, envie para o Google Agenda com lembrete no celular e marque como realizada depois.</p></div>
  <div class="row"><span class="seg"><button type="button" data-a="ag-modo" data-v="proximas" aria-pressed="${prox}">Próximas</button><button type="button" data-a="ag-modo" data-v="passadas" aria-pressed="${!prox}">Histórico</button></span>
  <button class="btn primary" data-a="nova-visita">+ Agendar visita</button></div></div>

async function carregarContagens(){
  if (!S.gestor || !S.db) return;
  const ids = [...new Set([S.me.id, ...S.equipe.map(e => e.id)])];
  const h = hojeISO();
  for (const id of ids){
    try {
      const [p, v] = await Promise.all([
        S.db.collection(`carteiras/${id}/parceiros`).limit(1000).get(),
        S.db.collection(`carteiras/${id}/visitas`).limit(1000).get()]);
      const ps = p.docs.map(d => d.data()), vs = v.docs.map(d => d.data());
      S.counts[id] = {
        imob: ps.filter(x => x.tipo==='imobiliaria').length, cor: ps.filter(x => x.tipo==='corretor').length,
        atras: ps.filter(x => x.proximoContato && x.proximoContato < h && x.etapa !== 'inativo').length,
        prox: vs.filter(x => x.status==='agendada' && x.inicio.slice(0,10) >= h).length,
        feitas: vs.filter(x => x.status==='realizada').length };
    } catch(e){}
  }
  if (S.route === 'equipe') render();
}

/* ---------- Google Agenda ---------- */
async function enviarGcal(v){
  if (!S.mcp){ S.gcalMsg[v.id] = {t:'Envio direto indisponível aqui. Use “Abrir formulário do Google”.', err:true}; render(); return; }
  S.busy[v.id] = true; delete S.gcalMsg[v.id]; render();
  const input = {summary:tituloVisita(v), startTime:v.inicio + ':00', endTime:fimDe(v.inicio, v.duracao) + ':00', timeZone:TZ,
    description:descVisita(v), location:v.local || undefined};
  const lem = (v.lembretes||[]).slice(0,5);
  if (lem.length){ input.useDefaultReminders = false; input.overrideReminders = lem.map(m => ({method:'popup', minutes:m})); }
  if (!input.location) delete input.location;
  try {
    const r = await S.mcp.callTool(CAL, 'create_event', input);
    const pl = r && r.payload;
    const ev = pl && typeof pl === 'object' ? (pl.event || pl) : {};
    const gcal = {em:Date.now()};
    if (ev.id) gcal.id = String(ev.id);
    if (ev.htmlLink) gcal.link = String(ev.htmlLink);
    await S.db.doc(`${cart()}/visitas/${v.id}`).update({gcal});
    S.gcalMsg[v.id] = {t:'Evento criado no seu Google Agenda com os lembretes escolhidos.', err:false};
  } catch(e){
    const code = e && e.code;
    const t = {
      server_not_connected:'Conecte o Google Agenda em claude.ai → Configurações → Conectores e tente de novo.',
      needs_reauth:'Sua conexão com o Google Agenda expirou. Reconecte em claude.ai → Configurações → Conectores.',
      selection_required:'Escolha qual conta do Google Agenda usar no aviso do Claude e tente de novo.',
      not_in_manifest:'O acesso ao Google Agenda foi recusado para esta página. Libere em Permissões e tente de novo.',
      approval_required:'O envio precisa da sua aprovação. Clique de novo e permita o acesso ao Google Agenda.',
      blocked_by_policy:'Sua organização bloqueou o Google Agenda aqui. Use “Abrir formulário do Google”.',
      tool_error:'O Google Agenda recusou o evento: ' + (e.message || 'confira data e horário.'),
    }[code] || 'Não foi possível confirmar o envio. Confira no seu Google Agenda antes de tentar de novo, para não duplicar o evento.';
    S.gcalMsg[v.id] = {t, err:true};
  }
  S.busy[v.id] = false; render();
}

/* ---------- distribuição da base ---------- */
function parseCSV(txt){
  txt = txt.replace(/^﻿/, '');
  const first = txt.split(/\r?\n/)[0] || '';
  const sep = (first.match(/;/g)||[]).length > (first.match(/,/g)||[]).length ? ';' : (first.includes('\t') ? '\t' : ',');
  const rows = []; let row = [], cur = '', q = false;
  for (let i = 0; i < txt.length; i++){
    const ch = txt[i];
    if (q){ if (ch === '"'){ if (txt[i+1] === '"'){ cur += '"'; i++; } else q = false; } else cur += ch; continue; }
    if (ch === '"') q = true;
    else if (ch === sep){ row.push(cur); cur = ''; }
    else if (ch === '\n' || ch === '\r'){ if (ch === '\r' && txt[i+1] === '\n') i++; row.push(cur); rows.push(row); row = []; cur = ''; }
    else cur += ch;
  }
  if (cur || row.length){ row.push(cur); rows.push(row); }
  return rows.filter(r => r.some(c => c.trim()));
}
const COLS = {
  nome:['nome','imobiliaria','corretor','razao social','parceiro','empresa'],
  tipo:['tipo','categoria'], telefone:['telefone','celular','whatsapp','fone','contato telefone'],
  email:['email','e-mail'], cidade:['cidade','municipio'], creci:['creci'], responsavel:['responsavel','contato','gerente'],
  agente:['agente','consultor','agente comercial','agente_email','email agente','responsavel ar','corretor ar']
};
async function importarCSV(file){
  const txt = await file.text();
  const rows = parseCSV(txt);
  if (rows.length < 2){ S.imp = 'A planilha está vazia ou sem cabeçalho.'; render(); return; }
  const head = rows[0].map(norm);
  const idx = {};
  for (const [k, al] of Object.entries(COLS)){ const i = head.findIndex(h => al.includes(h)); if (i >= 0) idx[k] = i; }
  if (idx.nome == null){ S.imp = 'Não encontrei a coluna “nome”. Renomeie a coluna principal para nome e importe de novo.'; render(); return; }
  let n = 0;
  for (const r of rows.slice(1)){
    const g = k => idx[k] != null ? String(r[idx[k]]||'').trim() : '';
    const nome = g('nome'); if (!nome) continue;
    const t = norm(g('tipo'));
    const tipo = t.includes('corretor') || t.includes('autonom') ? 'corretor' : 'imobiliaria';
    S.imp = `Importando ${++n}…`; if (n % 10 === 0) render();
    try { await S.db.collection('base').add({nome, tipo, telefone:g('telefone'), email:g('email'), cidade:g('cidade'), creci:g('creci'), responsavel:g('responsavel'), agente:g('agente'), importadoEm:Date.now()}); }
    catch(e){ S.imp = `Parou em ${n - 1} itens: ${e && e.code === 'quota_exceeded' ? 'limite de registros atingido.' : 'erro de conexão.'}`; render(); return; }
  }
  S.imp = `${n} parceiro${n===1?'':'s'} importado${n===1?'':'s'} para a base.`; render();
}
async function atribuir(b, agenteId){
  const id = S.db.collection(`carteiras/${agenteId}/parceiros`).doc().id;
  const ok = await salvar(`carteiras/${agenteId}/parceiros/${id}`, {tipo:b.tipo||'imobiliaria', etapa:'novo', nome:b.nome, responsavel:b.responsavel||'', creci:b.creci||'',
    telefone:b.telefone||'', email:b.email||'', cidade:b.cidade||'', proximoContato:hojeISO(), notas:'', historico:[], criadoEm:Date.now(), atualizadoEm:Date.now()});
  if (ok){ try { await S.db.doc('base/' + b.id).delete(); } catch(e){} }
  return ok;
}
function acharAgente(txt){
  const n = norm(txt); if (!n) return null;
  const ids = [...new Set([S.me.id, ...S.equipe.map(e => e.id)])];
  return ids.find(id => norm(emailDe(id)) === n) || ids.find(id => { const nm = norm(nomeDe(id)); return nm && (nm === n || nm.startsWith(n + ' ') || n.startsWith(nm)); }) || null;
}
async function autoDistribuir(){
  let ok = 0, sem = [];
  for (const b of S.base.filter(x => x.agente)){
    const id = acharAgente(b.agente);
    if (!id){ sem.push(b.agente); continue; }
    if (await atribuir(b, id)) ok++;
    S.imp = `Distribuindo… ${ok}`; render();
  }
  const faltam = [...new Set(sem)];
  S.imp = `${ok} distribuído${ok===1?'':'s'}.` + (faltam.length ? ` Sem agente correspondente: ${faltam.slice(0,5).join(', ')}${faltam.length>5?'…':''}. Esses agentes precisam entrar na central primeiro.` : '');
  carregarContagens(); render();
}

/* ---------- eventos ---------- */
document.addEventListener('click', async ev => {
  const b = ev.target.closest('[data-a]'); if (!b) return;
  const a = b.dataset.a, id = b.dataset.id;
  const p = id && S.parceiros.find(x => x.id === id);
  const v = id && S.visitas.find(x => x.id === id);
  if (a !== 'v-del' && a !== 'p-del') S.confirmDel = null;
  switch (a){
    case 'entrar':
      b.disabled = true;
      if (!await salvar('equipe/' + S.me.id, {entrouEm:Date.now()}, 'Bem-vindo à central')) b.disabled = false;
      break;
    case 'novo-parceiro': dlgParceiro(); break;
    case 'editar-parceiro': dlg.close(); dlgParceiro(S.parceiros.find(x => x.id === id)); break;
    case 'ver-parceiro': dlgVerParceiro(p); break;
    case 'contato': dlgContato(p); break;
    case 'nova-visita': dlgVisita(null, id); break;
    case 'editar-visita': dlgVisita(v); break;
    case 'gcal': enviarGcal(v); break;
    case 'v-status': await atualizar(`${cart()}/visitas/${id}`, {status:b.dataset.v, atualizadoEm:Date.now()},
      b.dataset.v === 'realizada' ? 'Visita marcada como realizada' : b.dataset.v === 'cancelada' ? 'Visita cancelada' : 'Visita reaberta');
      if (b.dataset.v === 'cancelada' && v && v.gcal) S.gcalMsg[id] = {t:'Lembre de excluir o evento no Google Agenda também.', err:false};
      break;
    case 'v-del':
      if (S.confirmDel === id){ S.confirmDel = null; try { await S.db.doc(`${cart()}/visitas/${id}`).delete(); toast('Visita excluída'); } catch(e){ toast('Não foi possível excluir.'); } }
      else { S.confirmDel = id; render(); }
      break;
    case 'p-del':
      if (S.confirmDel === id){ S.confirmDel = null; try { await S.db.doc(`${cart()}/parceiros/${id}`).delete(); dlg.close(); toast('Parceiro excluído'); } catch(e){ toast('Não foi possível excluir.'); } }
      else { S.confirmDel = id; b.textContent = 'Confirmar exclusão'; }
      break;
    case 'c-prox': { const inp = $('#c-prox'); if (inp) inp.value = addDias(hojeISO(), Number(b.dataset.v)); break; }
    case 'f-tipo': S.f.tipo = b.dataset.v; render(); break;
    case 'ag-modo': S.agModo = b.dataset.v; render(); break;
    case 'ver-carteira': setAlvo(id); location.hash = '#parceiros'; break;
    case 'recontar': S.counts = {}; render(); carregarContagens(); break;
    case 'atribuir': { const sel = document.getElementById('atr-' + id); const bb = S.base.find(x => x.id === id);
      if (sel && bb){ b.disabled = true; if (await atribuir(bb, sel.value)) { toast('Atribuído a ' + nomeDe(sel.value)); delete S.counts[sel.value]; carregarContagens(); } else b.disabled = false; } break; }
    case 'auto-dist': b.disabled = true; await autoDistribuir(); break;
  }
});
document.addEventListener('input', ev => {
  if (ev.target.id === 'f-q'){ S.f.q = ev.target.value; render(); }
});
document.addEventListener('change', ev => {
  const t = ev.target;
  if (t.id === 'f-etapa'){ S.f.etapa = t.value; render(); }
  else if (t.id === 'f-ord'){ S.f.ord = t.value; render(); }
  else if (t.id === 'sel-alvo'){ setAlvo(t.value); render(); }
  else if (t.id === 'imp-file' && t.files && t.files[0]){ S.imp = 'Lendo planilha…'; render(); importarCSV(t.files[0]); }
});
setInterval(() => { if (S.status === 'ok' && S.entrou && S.route === 'hoje' && !dlg.open) render(); }, 60000);

boot();
})();
</script>
